<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a090c" />
    <meta name="robots" content="noindex" />
    <title>Hors ligne — À deux</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background:
          radial-gradient(120% 90% at 50% 0%, #3a0b14 0%, #0a090c 58%),
          #0a090c;
        color: #eae4dc;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        text-align: center;
      }
      main {
        max-width: 360px;
      }
      .heart {
        width: 76px;
        height: 76px;
        margin: 0 auto 22px;
        display: grid;
        place-items: center;
        border-radius: 24px;
        background: linear-gradient(135deg, #b71f36, #5a0c17);
        border: 1px solid rgba(197, 160, 89, 0.55);
        box-shadow: 0 18px 50px -18px rgba(158, 25, 45, 0.9);
      }
      .heart svg {
        width: 38px;
        height: 38px;
      }
      h1 {
        margin: 0;
        font-family: "Cormorant Garamond", Didot, Georgia, "Times New Roman", serif;
        font-size: 26px;
        font-weight: 500;
        letter-spacing: -0.01em;
      }
      p {
        margin: 12px 0 0;
        font-size: 13.5px;
        line-height: 1.65;
        color: rgba(234, 228, 220, 0.6);
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 22px;
        padding: 11px 22px;
        border-radius: 999px;
        border: 1px solid rgba(197, 160, 89, 0.45);
        background: rgba(158, 25, 45, 0.22);
        color: #eae4dc;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
      }
      small {
        display: block;
        margin-top: 18px;
        font-size: 10.5px;
        color: rgba(234, 228, 220, 0.35);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="heart" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none">
          <path
            d="M32 48.5S15 39.2 15 27.7c0-5.4 4.2-9.2 9-9.2 3.2 0 6 1.8 8 4.6 2-2.8 4.8-4.6 8-4.6 4.8 0 9 3.8 9 9.2C49 39.2 32 48.5 32 48.5Z"
            fill="#c5a059"
          />
        </svg>
      </div>
      <h1>Vous êtes hors ligne</h1>
      <p>
        Pas de réseau pour le moment. Vos idées, vos matchs et votre espace à
        deux vous attendent dès que la connexion revient.
      </p>
      <a href="/">Réessayer</a>
      <small>À deux — aucune donnée n’est perdue.</small>
    </main>
  </body>
</html>
